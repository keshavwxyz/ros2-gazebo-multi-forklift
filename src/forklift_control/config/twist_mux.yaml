# Arbitration of the velocity commands before the drive controller (docs/system_design.md D9).
# The source with the higher priority wins. If the last message of a source is older than
# `timeout`, the mux does not use that source.
twist_mux:
  ros__parameters:
    use_stamped: true           # diff_drive_controller (Jazzy) accepts only TwistStamped
    topics:
      navigation:
        topic: /cmd_vel/nav
        timeout: 0.5
        priority: 10
      approach:
        topic: /cmd_vel/approach
        timeout: 0.3
        priority: 50
      teleop:
        topic: /cmd_vel/teleop
        timeout: 0.5
        priority: 100
    locks:
      # std_msgs/Bool true = stopped. There is no timeout: the lock stays on until a node publishes false.
      estop:
        topic: /estop
        timeout: 0.0
        priority: 255
